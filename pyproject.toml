[project]
name = "agent-bmc"
version = "0.1.0"
description = "Agente BMC: gestión de incidentes y órdenes de trabajo en BMC Helix ARUS con LangGraph/LangChain"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.0",
  "langchain==1.2.15",
  "langgraph==1.1.6",
  "langchain-anthropic==1.4.1",
  "langchain-openai==1.2.1",
  "langchain-ollama==1.1.0",
  "langchain-huggingface==1.2.2",
  "langfuse==4.6.1",
  "langchain-mcp-adapters==0.2.2",
  "mcp[cli]==1.27.0",
  "pydantic==2.13.1",
  "pydantic-settings==2.13.1",
  "python-dotenv==1.2.2",
  "uvicorn[standard]==0.44.0",
  "sqlalchemy==2.0.49",
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "psycopg[binary]==3.3.3",
  "langgraph-checkpoint-postgres==3.0.5",
  "httpx==0.28.1",
  "toon-formatter==1.0.1",
  "certifi==2026.6.17",
  "tzdata==2026.2",
]

[project.scripts]
agente = "agent.cli:main"
agent-bmc-http = "http_api.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/agent",
  "src/bmc",
  "src/config",
  "src/exception",
  "src/http_api",
  "src/commons",
  "src/database",
  "src/services",
  "src/type_defs",
]

[dependency-groups]
dev = [
  "pylint==4.0.5",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.11",
  "watchfiles==1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["src"]
