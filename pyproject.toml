[project]
name = "agent-bmc"
version = "0.1.0"
description = "Agente BMC: gestión de incidentes y órdenes de trabajo en BMC Helix ARUS con LangGraph/LangChain"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.0",
  "langchain==1.4.9",
  "langgraph==1.2.20",
  "langchain-anthropic==1.7.10",
  "langchain-openai==1.7.4",
  "langchain-ollama==1.1.0",
  "langchain-huggingface==1.2.3",
  "langfuse==5.2.0",
  "langchain-mcp-adapters==0.3.2",
  "mcp[cli]==1.30.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "python-dotenv==1.2.4",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.8",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "psycopg[binary]==3.3.8",
  "langgraph-checkpoint-postgres==3.2.0",
  "httpx==0.28.1",
  "toon-formatter==1.0.1",
  "certifi==2026.10.23",
  "tzdata==2026.6",
]

[project.scripts]
agente = "agent.cli:main"
agent-bmc-http = "http_api.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/agent",
  "src/bmc",
  "src/config",
  "src/exception",
  "src/http_api",
  "src/commons",
  "src/database",
  "src/services",
  "src/type_defs",
]

[dependency-groups]
dev = [
  "pylint==4.1.3",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.3",
  "watchfiles==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["src"]
